# The solvers in this prototype decide where a child sleeps, who is allowed on
# a rota, and what a supplier is owed. Each one carries a selfCheck asserting
# the things that would be silently wrong rather than loudly broken. Those
# checks used to run only in a dev browser tab, which meant a regression could
# land in the demo file with a clean build. Now they gate every push.
name: check

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run check
        working-directory: web
      - run: npm run build
        working-directory: web
